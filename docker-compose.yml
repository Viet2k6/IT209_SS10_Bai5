services:
  database:
    image: postgres:15-alpine
 
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net

  backend:
    image: adminer:4
 
    restart: unless-stopped
    ports:
      - "${PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
      DB_HOST: database
    depends_on:
      - database
    networks:
      - backend-net

volumes:
  pgdata:

networks:
  backend-net:
    driver: bridge